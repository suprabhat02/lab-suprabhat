name: Deploy

# Builds the static site and publishes it to GitHub Pages.
# lab.suprabhat-dev.com is a CNAME to suprabhat02.github.io, and the custom
# domain is set in Settings → Pages. No secrets are needed: deploy-pages
# authenticates with the workflow's OIDC token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Ping IndexNow
    needs: deploy
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Reuse the exact files that were deployed instead of rebuilding.
      - name: Download the Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Unpack into dist
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist

      - name: Submit the sitemap URLs
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
