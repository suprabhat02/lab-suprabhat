name: Wrong result
description: A tool gave an answer you believe is wrong.
title: 'Wrong result: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking. Issues are public, so don't paste private or confidential code.
        Reduce the input to the smallest example that still shows the problem.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - CSS Specificity Wars
        - Selector Playground
        - Stylesheet Audit
        - Accessible Name Wars
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The input you pasted
      description: The selectors, CSS or HTML exactly as entered.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected, with a link to the specification or browser behaviour if you have one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What the tool showed.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version, for example Firefox 150 on Windows 11.
    validations:
      required: true
